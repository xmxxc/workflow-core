[package]
name = "herdr-kernel-prototype"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
members = ["crates/ghostty-vt"]

[dependencies]
anyhow = "1"
ghostty-vt = { path = "crates/ghostty-vt" }
portable-pty = "=0.9.0"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
