name: Windows bundled scoped relay
on:
  push:
    branches: [experiment/bundled-relay-35]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      CANDIDATE: 95ef40f57387393be60def7f9289c5ed9e563b1b
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Download published experimental ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download kernel-experiment-20261118.2 --dir artifact
      - name: Verify candidate and exercise detached relay
        run: |
          $archive = Get-Item "artifact/wfc-kernel-experiment-$env:CANDIDATE-windows-x64.zip"
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne (Get-Content artifact/SHA256SUMS).Split(' ')[0]) { throw 'ZIP digest mismatch' }
          if ($digest -ne '0c137a333e77b33ab23ccf9606b4609fb5425f4a16644bc9337a08a9af05e2ae') { throw 'Published ZIP identity mismatch' }
          Write-Output "ZIP SHA-256 $digest"
          $root = "$env:RUNNER_TEMP/Relocated Candidate"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $root
          python tools/package_bundled_experiment.py verify --directory "$root/wfc" --commit $env:CANDIDATE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:WFC_TEST_PROGRAM = "$root/wfc/wfc.pyz"
          $env:WFC_BUNDLED_TEST_KERNEL = "$root/wfc/wfc-kernel.exe"
          $env:WFC_BUNDLED_TEST_DISCOVERY = '1'
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:exe /out:$env:RUNNER_TEMP/codex.exe tests/fixtures/queue_probe.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP;$env:PATH"
          python tests/windows_relay_probe.py
