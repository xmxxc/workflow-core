name: Bundled kernel experiment

on:
  pull_request:
    paths:
      - '.github/workflows/bundled-kernel-experiment.yml'
      - 'build.py'
      - 'bundled_*.py'
      - 'router.py'
      - 'wfc*.py'
      - 'host_launch.py'
      - 'experiments/herdr-kernel-prototype/**'
      - 'tests/test_bundled*.py'
      - 'tests/fixtures/bundled_worker.py'
      - 'tools/package_bundled_experiment.py'
      - 'docs/bundled-backend.md'
      - 'docs/verification/bundled-kernel-experiment.md'
  push:
    tags: ['kernel-experiment-*']

permissions:
  contents: read

jobs:
  native:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'experiment/bundled-kernel-') ||
      startsWith(github.head_ref, 'codex/bundled-kernel-')))
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      PYTHONUTF8: '1'
      RUSTUP_TOOLCHAIN: '1.96.1'
      CARGO_HOME: ${{ runner.temp }}/bundled-cargo
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      # Process-local Git override also applies before checkout; no user config mutation.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Initialize isolated command evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory "$env:RUNNER_TEMP/evidence" | Out-Null
          @'
          function Invoke-Checked([string]$Name, [scriptblock]$Command) {
            $global:LASTEXITCODE = 0
            $code = 0
            try {
              & $Command 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/evidence/$Name.log"
              $code = $LASTEXITCODE
            } catch {
              $_ | Out-String | Tee-Object -FilePath "$env:RUNNER_TEMP/evidence/$Name.log" -Append
              $code = 1
            }
            @{ name=$Name; command=$Command.ToString(); exit=$code; utc=[DateTime]::UtcNow.ToString('o') } |
              ConvertTo-Json -Compress | Add-Content -Encoding utf8 "$env:RUNNER_TEMP/evidence/commands.jsonl"
            if ($code -ne 0) { throw "$Name failed with exit $code" }
          }
          function Assert-NativeCoverage([string]$Log) {
            $text = Get-Content -Raw "$env:RUNNER_TEMP/evidence/$Log.log"
            foreach ($test in @('standalone_dispatch_reply_done_and_close', 'wrong_nonce_and_generation_cannot_input_or_close',
                'interrupt_close_resume_replaces_execution_identity', 'close_contains_setsid_descendant',
                'parent_first_exit_cleans_descendant_and_allows_resume', 'runtime_forced_death_cleans_descendants_without_restarting')) {
              if ($text -notmatch ("(?m)^test_" + $test + " \(test_bundled.BundledNative\.[^\r\n]+\) \.\.\. ok\r?$")) {
                throw "Required native contract did not pass: $test"
              }
            }
          }
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/record.ps1"
          . "$env:RUNNER_TEMP/record.ps1"
          Invoke-Checked identity {
            $head = git rev-parse HEAD
            if ($LASTEXITCODE -or $head -ne $env:CANDIDATE) { throw 'Candidate checkout mismatch' }
            git rev-parse 'HEAD^{tree}'
            if (git status --porcelain) { throw 'Candidate checkout must be clean' }
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            python --version
          }
          "CODEX_HOME=$env:RUNNER_TEMP/no-account-codex" >> $env:GITHUB_ENV
          "WFC_STATE=$env:RUNNER_TEMP/isolated-wfc-state" >> $env:GITHUB_ENV
      - name: Require an approved exact native candidate for publication
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . "$env:RUNNER_TEMP/record.ps1"
          Invoke-Checked publication-gate {
            # Controller creates this annotated tag only after review + all verification.
            $type = git cat-file -t "refs/tags/$env:GITHUB_REF_NAME"
            if ($type -ne 'tag') { throw 'Use an annotated experiment tag' }
            $annotation = git for-each-ref --format='%(contents)' "refs/tags/$env:GITHUB_REF_NAME"
            $text = $annotation -join "`n"
            if ($text -notmatch "(?m)^Reviewed-commit: $env:CANDIDATE`r?$") { throw 'Missing exact reviewed commit' }
            if ($text -notmatch '(?m)^Native-CI-run: ([0-9]+)\r?$') { throw 'Missing native PR run ID' }
            $runId = $Matches[1]
            $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId"
            if ($LASTEXITCODE) { throw 'Cannot read referenced native run' }
            $run = $runJson | ConvertFrom-Json
            if ($run.head_sha -ne $env:CANDIDATE -or $run.event -ne 'pull_request' -or
                $run.conclusion -ne 'success' -or $run.path -ne '.github/workflows/bundled-kernel-experiment.yml') {
              throw 'Referenced native run must have passed this workflow on exactly this commit'
            }
            $run | Select-Object id, head_sha, conclusion, html_url | ConvertTo-Json
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: herdrdev/herdr
          ref: ee5bfb5041bb3e4a49d591c72308aae3c81ecdde
          path: upstream
          persist-credentials: false
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943
        with:
          version: '0.16.0'
      - name: Build the pinned native kernel and collect actual target notices
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP/record.ps1"
          $env:PREPARED = "$env:RUNNER_TEMP/prepared"
          "PREPARED=$env:PREPARED" >> $env:GITHUB_ENV
          Invoke-Checked rust-install { rustup toolchain install 1.96.1 --profile minimal }
          Invoke-Checked toolchains {
            rustc -Vv
            if ($LASTEXITCODE) { throw 'rustc failed' }
            cargo -V
            if ($LASTEXITCODE) { throw 'cargo failed' }
            zig version
          }
          Invoke-Checked prepare { python experiments/herdr-kernel-prototype/prepare.py --source upstream --scratch $env:PREPARED }
          Invoke-Checked native-build { cargo build --manifest-path "$env:PREPARED/Cargo.toml" --release --locked --target x86_64-pc-windows-msvc }
          Invoke-Checked notices { python experiments/herdr-kernel-prototype/collect_notices.py $env:PREPARED x86_64-pc-windows-msvc "$env:RUNNER_TEMP/notices" }
          "WFC_BUNDLED_TEST_KERNEL=$env:PREPARED/target/x86_64-pc-windows-msvc/release/herdr-kernel-prototype.exe" >> $env:GITHUB_ENV
      - name: Native cross-process contracts from the fixed source
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP/record.ps1"
          Invoke-Checked no-account-boundary {
            if (Test-Path "$env:CODEX_HOME/auth.json") { throw 'Unexpected account credentials' }
            if ($env:WFC_TEST_PROGRAM -or $env:WFC_BUNDLED_TEST_DISCOVERY) { throw 'Unexpected packaged-test override' }
            'Controlled tests/fixtures/bundled_worker.py, explicit Python runtime; no model, account, desktop queue or complete Herdr install.'
          }
          Invoke-Checked source-contracts { python -m unittest discover -s tests -p test_bundled.py -v }
          Invoke-Checked source-coverage { Assert-NativeCoverage source-contracts }
          Invoke-Checked packaging-controls { python -m unittest discover -s tests -p test_bundled_experiment_package.py -v }
      - name: Build, zip and verify a newly extracted payload with spaces
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP/record.ps1"
          Invoke-Checked package {
            python tools/package_bundled_experiment.py create --prepared $env:PREPARED --notices "$env:RUNNER_TEMP/notices" --kernel $env:WFC_BUNDLED_TEST_KERNEL --output dist/experiment --commit $env:CANDIDATE
          }
          Invoke-Checked extract {
            $archive = Get-Item "dist/experiment/wfc-kernel-experiment-$env:CANDIDATE-windows-x64.zip"
            $expected = (Get-Content dist/experiment/SHA256SUMS).Split(' ')[0]
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP hash mismatch' }
            $destination = "$env:RUNNER_TEMP/New Extracted Payload with spaces"
            if (Test-Path $destination) { throw 'Extraction destination must be new' }
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination
            "EXTRACTED=$destination/wfc" >> $env:GITHUB_ENV
            $archive | Select-Object Name, Length
          }
      - name: Relocated launcher and co-located companion contracts
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP/record.ps1"
          Invoke-Checked verify-extracted { python tools/package_bundled_experiment.py verify --directory $env:EXTRACTED --commit $env:CANDIDATE }
          Invoke-Checked cmd-version { & "$env:EXTRACTED/wfc.cmd" --version }
          Invoke-Checked cmd-help { & "$env:EXTRACTED/wfc.cmd" --help }
          $env:WFC_TEST_PROGRAM = "$env:EXTRACTED/wfc.pyz"
          # The test class uses this as its real-native enable flag, then removes
          # WFC_BUNDLED_KERNEL from each dispatched child's env for co-location discovery.
          $env:WFC_BUNDLED_TEST_KERNEL = "$env:EXTRACTED/wfc-kernel.exe"
          $env:WFC_BUNDLED_TEST_DISCOVERY = '1'
          Invoke-Checked packaged-contracts { python -m unittest discover -s tests -p test_bundled.py -v }
          Invoke-Checked packaged-coverage { Assert-NativeCoverage packaged-contracts }
      - name: Preserve command results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundled-native-evidence-${{ env.CANDIDATE }}-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/evidence/
      - name: Retain internal candidate only after all native checks pass
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: internal-bundled-experiment-${{ env.CANDIDATE }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/experiment/*.zip
            dist/experiment/SHA256SUMS

  publish-experimental:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kernel-experiment-')
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      CANDIDATE: ${{ github.sha }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download this run's verified candidate and publish the prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name "internal-bundled-experiment-$CANDIDATE" --dir release
          cd release
          sha256sum -c SHA256SUMS
          cat > NOTES.md <<EOF
          Opt-in bundled kernel EXPERIMENTAL Windows x64 candidate, commit $CANDIDATE.
          Native evidence: https://github.com/$GH_REPO/actions/runs/$RUN_ID
          Read WINDOWS-MANUAL.md, BUNDLED-EXPERIMENTAL.md and EXPERIMENT.json inside the ZIP.
          Python and an explicitly configured, separately authorized host installation are required.
          Controlled CI does not establish real-host Windows acceptance. Claude is disabled.
          Existing stable releases, default backend and existing dispatches remain unchanged.
          EOF
          gh release create "$TAG" "wfc-kernel-experiment-$CANDIDATE-windows-x64.zip" SHA256SUMS --verify-tag --prerelease --latest=false --title "WFC bundled kernel EXPERIMENTAL $TAG" --notes-file NOTES.md
