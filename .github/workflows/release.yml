name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Check the tag matches wfc's version
        run: |
          version="$(python -c 'import wfc; print(wfc.VERSION)')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Build
        run: |
          python build.py --out dist/wfc
          dist/wfc --version
          python build.py --windows-dir dist/windows
          cp dist/windows/wfc.pyz dist/wfc.pyz
          cp docs/windows-distribution.md dist/windows/README-Windows.md
          cp docs/herdr-backend.md docs/host-launch.md docs/windows-core.md dist/windows/
          cp docs/verification/windows-opencode-release.md dist/windows/OPENCode-Windows.md
          git rev-parse HEAD > dist/windows/COMMIT.txt
          python - <<'PYZIP'
          import os, zipfile
          from pathlib import Path
          root = Path("dist/windows")
          target = Path("dist") / ("wfc-" + os.environ["GITHUB_REF_NAME"] + "-windows-x64.zip")
          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.iterdir()):
                  archive.write(path, "wfc/" + path.name)
          PYZIP
          python dist/wfc.pyz --version
          (cd dist && sha256sum wfc > wfc.sha256 && sha256sum wfc wfc.pyz "wfc-${GITHUB_REF_NAME}-windows-x64.zip" > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "wfc ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          notes=(--generate-notes)
          if [[ -f "docs/releases/${GITHUB_REF_NAME}.md" ]]; then
            notes=(--notes-file "docs/releases/${GITHUB_REF_NAME}.md")
          fi
          gh release create "${GITHUB_REF_NAME}" dist/wfc dist/wfc.pyz dist/wfc.sha256 dist/SHA256SUMS "dist/wfc-${GITHUB_REF_NAME}-windows-x64.zip" "${flags[@]}" "${notes[@]}"
