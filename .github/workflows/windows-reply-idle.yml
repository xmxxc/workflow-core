name: Windows single reply observation
on:
  push:
    branches: ['experiment/windows-reply-idle-36']
permissions:
  contents: read
  actions: read
jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        case: [early, worker]
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Fetch fixed candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44753578583 -R xmxxc/workflow-core -n internal-bundled-experiment-2409c40b469e0e40bd5c55326df3d5ebb86ca81b -D "$env:RUNNER_TEMP/input"
          exit $LASTEXITCODE
      - name: Exercise downloaded desktop collector
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((Get-FileHash tools/windows-desktop-short-r2.zip).Hash -ne '4f47de13cf0b9e1cf1bcdc84e2d05a64c677a32f6d491fcac758769e522ec9ec') {throw 'ZIP hash'}
          Expand-Archive -LiteralPath tools/windows-desktop-short-r2.zip -DestinationPath "$env:RUNNER_TEMP/desktop"
          & "$env:RUNNER_TEMP/desktop/ci/run-native.ps1" -CandidateZip "$env:RUNNER_TEMP/input/wfc-kernel-experiment-2409c40b469e0e40bd5c55326df3d5ebb86ca81b-windows-x64.zip" -DesktopTools "$env:RUNNER_TEMP/desktop/desktop" -Case "${{ matrix.case }}" -Trial "$env:RUNNER_TEMP/collector"
          exit $LASTEXITCODE
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collector-evidence-${{ matrix.case }}
          path: ${{ runner.temp }}/collector/evidence/
          retention-days: 7
