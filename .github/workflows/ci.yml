name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        # The tests put fake tmux and host CLIs on PATH; no real tmux, Codex, Claude Code or OpenCode is needed.
        run: python -m unittest discover -s tests -v
      - name: Build and smoke-test wfc
        run: |
          python build.py --out dist/wfc
          dist/wfc --version
          dist/wfc --help
